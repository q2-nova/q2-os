# Kernel messages stay in the ring buffer (dmesg); only warnings and worse go
# to the 115200-baud serial console, which nothing reads in normal use. At the
# kernel's default console level 15 a message burst kept CPU 0 in the console
# thread for nine minutes.
kernel.printk = 4 4 1 7
# Write back early and in small amounts: a fetch-ahead burst (four songs,
# 24-120 MB) otherwise builds a long write queue on the card, and the
# player's reads of the playing song stall behind it into ALSA underruns.
# underrun-dirty-01: 0 write recoveries in four Original stream arms with
# these, 2 in four with the defaults (q2-factory
# projects/listening-reliability/STATUS.md, LR-012).
vm.dirty_background_bytes = 2097152
vm.dirty_bytes = 8388608
# Memory headroom (docs/validation/memory-headroom-kernel-2026-11-21.md).
# zram swap (S77q2-memory-guard): anonymous pages go to compressed RAM at the
# same cost as dropping file pages, which the Q2 rereads from NAND through a
# 128 KiB gzip block; one page per swap-in, no readahead.
vm.swappiness = 100
vm.page-cluster = 0
# kswapd wakes about 1.2 MB above the minimum (watermark gap 118 MB * 100 /
# 10000) and reclaims to 2.4 MB above it, so a UI allocation rarely waits in
# direct reclaim; 2 MB minimum for atomic network-receive allocations.
vm.min_free_kbytes = 2048
vm.watermark_scale_factor = 100
# No watermark boost after fragmentation events (the Wi-Fi driver's order-3
# allocations): with the default 15000 each event raises the watermarks and
# kswapd reclaims far past them. V0.127, 24 MB hog, 2 runs each: direct-reclaim
# stalls 0 and 12 with 0 against 2 and 212 with 15000, kswapd scans 2.5k and
# 20k against 0.9k and 74k, no OOM kill either way
# (docs/validation/kernel-g6-2026-11-21.md).
vm.watermark_boost_factor = 0
# Dentries and inodes (exFAT library, about 3.6 MB) go before program text.
vm.vfs_cache_pressure = 150
