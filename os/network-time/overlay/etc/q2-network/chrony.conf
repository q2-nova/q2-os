# Explicit basic NTP policy. No NTS source is configured or downgraded.
# Cloudflare's standard UTC service; do not mix with leap-smearing servers.
server time.cloudflare.com iburst
# Standard chrony startup step policy, without a custom accepted-time bound.
makestep 1.0 3
pidfile /run/q2-time/chronyd.pid
bindcmdaddress /run/q2-time/chronyd.sock
cmdport 0
port 0
# Persist only RTC, not measurement/log/drift files on NAND.
rtcsync
logdir /run/log
