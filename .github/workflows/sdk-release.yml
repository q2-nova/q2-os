name: SDK release
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Check inputs, qualify a new SDK, or draft an existing qualified SDK
        type: choice
        options: [validate, qualify, promote]
        default: validate
      source_commit:
        description: Optional full signed OS source commit for CI qualification
        type: string
      release_tag:
        description: Existing sdk-vX.Y.Z tag for promotion
        type: string
      qualification_run:
        description: Successful qualify workflow run ID for promotion
        type: string
      redistribution_reviewed:
        description: Notices, corresponding source and redistribution reviewed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host-checks:
    uses: ./.github/workflows/host-checks.yml
  validate-tag:
    if: github.event_name == 'push'
    needs: host-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check SDK tag syntax
        run: '[[ "$GITHUB_REF_NAME" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
  qualify:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify'
    needs: host-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve signed runtime sources
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          OS_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          [[ "$OS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$OS_COMMIT" --jq 'if .commit.verification.verified then .sha else empty end')
          [[ "$sha" == "$OS_COMMIT" ]]
          printf 'commit=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime-source
          persist-credentials: false
      - name: Initialize the pinned OS build container and target
        working-directory: runtime-source
        run: |
          command -v podman
          python3 os/build.py container
          python3 os/build.py configure
      - name: Compile the first Buildroot SDK dependency
        working-directory: runtime-source
        run: python3 os/build.py build host-cpio
      - name: Build the complete SDK from the source lock
        working-directory: runtime-source
        run: python3 os/build.py sdk
      - name: Test relocation and ABI and freeze qualified bytes
        working-directory: runtime-source
        run: |
          python3 os/test_sdk.py
          image_id="$(podman image inspect q2-os-build --format '{{.Id}}')"
          python3 os/sdk_release.py freeze \
            --archive build/os/out/images/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz \
            --report build/os/sdk-test.json --config build/os/out/.config \
            --container "sha256:${image_id#sha256:}" \
            --out build/qualified-sdk
      - name: Freeze installed userspace inputs for the same SDK
        env:
          OS_COMMIT: ${{ steps.runtime.outputs.commit }}
        run: |
          python3 os/sdk_platform.py freeze --os-commit "$OS_COMMIT" \
            --sdk-bundle runtime-source/build/qualified-sdk --target runtime-source/build/os/out/target \
            --platform runtime-source/build/qualified-platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q2-sdk-qualification
          path: runtime-source/build/qualified-sdk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q2-os-platform
          path: runtime-source/build/qualified-platform/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  verify-promotion:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    needs: host-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      archive_sha256: ${{ steps.recheck.outputs.archive_sha256 }}
      source_commit: ${{ steps.provenance.outputs.source_commit }}
      artifact_id: ${{ steps.provenance.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind tag and qualifying run to this signed source
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.release_tag }}
          SDK_RUN: ${{ inputs.qualification_run }}
          SDK_REVIEWED: ${{ inputs.redistribution_reviewed }}
        run: |
          [[ "$SDK_REVIEWED" == true ]]
          [[ "$SDK_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SDK_RUN" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SDK_TAG" --jq 'if .commit.verification.verified then .sha else empty end')
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$GITHUB_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SDK_RUN" > "$RUNNER_TEMP/sdk-run.json"
          jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .event == "workflow_dispatch" and
            .path == ".github/workflows/sdk-release.yml" and .head_sha == $sha and
            .head_repository.full_name == $repo' "$RUNNER_TEMP/sdk-run.json"
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SDK_RUN/artifacts" --jq '
            [.artifacts[] | select(.name == "q2-sdk-qualification" and .expired == false)] |
            if length == 1 then .[0].id else empty end')
          [[ "$artifact" =~ ^[0-9]+$ ]]
          printf 'source_commit=%s\nartifact_id=%s\n' "$sha" "$artifact" >> "$GITHUB_OUTPUT"
          gh run download "$SDK_RUN" --repo "$GITHUB_REPOSITORY" --name q2-sdk-qualification --dir build/qualified-sdk
      - name: Verify and independently relocate the admitted archive
        id: recheck
        env:
          SDK_COMMIT: ${{ steps.provenance.outputs.source_commit }}
        run: |
          python3 os/sdk_release.py verify --bundle build/qualified-sdk --os-commit "$SDK_COMMIT" > build/verified-sdk.json
          python3 os/test_sdk.py --archive build/qualified-sdk/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz --report build/rechecked-sdk.json
          sha=$(jq -er '.archive_sha256' build/verified-sdk.json)
          jq -e --arg sha "$sha" '.passed == true and .sdk_sha256 == $sha' build/rechecked-sdk.json
          printf 'archive_sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
  draft:
    needs: verify-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency: sdk-draft-${{ inputs.release_tag }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download exact verified qualification and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.release_tag }}
          SDK_ARTIFACT: ${{ needs.verify-promotion.outputs.artifact_id }}
          SDK_COMMIT: ${{ needs.verify-promotion.outputs.source_commit }}
          SDK_SHA256: ${{ needs.verify-promotion.outputs.archive_sha256 }}
        run: |
          [[ "$SDK_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SDK_ARTIFACT" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SDK_TAG" --jq 'if .commit.verification.verified then .sha else empty end')
          [[ "$sha" == "$SDK_COMMIT" && "$sha" == "$GITHUB_SHA" ]]
          mkdir -p build/qualified-sdk
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SDK_ARTIFACT/zip" > build/sdk-bundle.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          bundle = Path('build/qualified-sdk')
          names = {'mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz', 'sdk-test.json',
                   'buildroot.config', 'sdk-manifest.json', 'SHA256SUMS'}
          with ZipFile('build/sdk-bundle.zip') as archive:
              if set(archive.namelist()) != names or len(archive.namelist()) != len(names):
                  raise ValueError('unexpected content in qualification bundle')
              for name in names:
                  archive.extract(name, bundle)
          PY
          python3 os/sdk_release.py verify --bundle build/qualified-sdk --os-commit "$SDK_COMMIT" --expected-archive "$SDK_SHA256"
          printf 'Qualified Buildroot SDK for q2-os %s.\n\nArchive SHA-256: `%s`.\n' "$SDK_COMMIT" "$SDK_SHA256" > build/sdk-release-notes.md
          gh release create "$SDK_TAG" build/qualified-sdk/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Q2 SDK $SDK_TAG" --notes-file build/sdk-release-notes.md
