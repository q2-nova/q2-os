name: SDK release
on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      operation:
        description: Check source or qualify SDK inputs without publishing
        type: choice
        options: [validate, qualify]
        default: validate
      source_commit:
        description: Optional full signed OS source commit for CI qualification
        type: string

permissions:
  contents: read

jobs:
  host-checks:
    uses: ./.github/workflows/host-checks.yml
  qualify:
    if: github.event_name == 'push' || inputs.operation == 'qualify'
    needs: host-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve signed runtime sources
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          OS_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          [[ "$OS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
            [[ "$OS_COMMIT" == "$GITHUB_SHA" ]]
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$OS_COMMIT" --jq 'if .commit.verification.verified then .sha else empty end')
          [[ "$sha" == "$OS_COMMIT" ]]
          printf 'commit=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime-source
          persist-credentials: false
      - name: Initialize the pinned OS build container and target
        working-directory: runtime-source
        run: |
          command -v podman
          python3 os/build.py container
          python3 os/build.py configure
      - name: Compile the first Buildroot SDK dependency
        working-directory: runtime-source
        run: python3 os/build.py build host-cpio
      - name: Build the complete SDK from the source lock
        working-directory: runtime-source
        run: python3 os/build.py sdk
      - name: Test relocation and ABI and freeze qualified bytes
        working-directory: runtime-source
        run: |
          python3 os/test_sdk.py
          image_id="$(podman image inspect q2-os-build --format '{{.Id}}')"
          python3 os/sdk_release.py freeze \
            --archive build/os/out/images/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz \
            --report build/os/sdk-test.json --config build/os/out/.config \
            --container "sha256:${image_id#sha256:}" \
            --out build/qualified-sdk
      - name: Freeze installed userspace inputs for the same SDK
        env:
          OS_COMMIT: ${{ steps.runtime.outputs.commit }}
        run: |
          python3 os/sdk_platform.py freeze --os-commit "$OS_COMMIT" \
            --sdk-bundle runtime-source/build/qualified-sdk --target runtime-source/build/os/out/target \
            --platform runtime-source/build/qualified-platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q2-sdk-qualification
          path: runtime-source/build/qualified-sdk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q2-os-platform
          path: runtime-source/build/qualified-platform/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Collect corresponding source and notices for the tagged release
        if: github.event_name == 'push'
        working-directory: runtime-source
        run: |
          python3 os/build.py build legal-info
          legal=build/os/out/legal-info
          test -s "$legal/manifest.csv"
          test -s "$legal/host-manifest.csv"
          git -C build/os/buildroot-2026.08.1 archive --format=tar.gz --prefix=buildroot/ HEAD > "$legal/buildroot-source.tar.gz"
          git archive --format=tar.gz --prefix=q2-os/ HEAD > "$legal/q2-os-source.tar.gz"
          tar -C build/os/out -czf build/os/buildroot-legal-info.tar.gz legal-info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: q2-sdk-compliance
          path: runtime-source/build/os/buildroot-legal-info.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish-rc:
    if: github.event_name == 'push'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency: q2-os-rc-${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q2-sdk-qualification
          path: build/release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q2-os-platform
          path: build/release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: q2-sdk-compliance
          path: build/release-assets
      - name: Recheck the assets and publish a tagged SDK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 os/sdk_platform.py verify --os-commit "$GITHUB_SHA" \
            --sdk-bundle build/release-assets --platform build/release-assets
          cd build/release-assets
          files=(mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz sdk-manifest.json sdk-test.json
                 buildroot.config SHA256SUMS target.tar.gz platform.json buildroot-legal-info.tar.gz)
          sha256sum "${files[@]}" > RELEASE-SHA256SUMS
          files+=(RELEASE-SHA256SUMS)
          printf 'Qualified Q2 SDK and matching userspace platform for %s.\n\nFor downstream cross-builds and QEMU integration.\n' "$GITHUB_SHA" > ../release-notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --latest=false --verify-tag \
            --title "Q2 OS $GITHUB_REF_NAME" --notes-file ../release-notes.md
          release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > ../uploaded-assets.json
          python3 - "${files[@]}" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          with Path('../uploaded-assets.json').open() as source:
              remote = json.load(source)
          names = sys.argv[1:]
          if len(remote) != len(names) or {row['name'] for row in remote} != set(names):
              raise SystemExit('uploaded prerelease draft has missing or unexpected files')
          for row in remote:
              local = Path(row['name'])
              with local.open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if row['size'] != local.stat().st_size or row['digest'] != digest:
                  raise SystemExit('uploaded asset bytes differ from checked files')
          PY
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
