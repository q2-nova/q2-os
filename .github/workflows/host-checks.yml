name: OS host checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check document links and hardware reference rows
        run: python3 tools/check_docs.py
      - name: Check Python entry points and shell syntax
        run: |
          python3 -m compileall -q os kernel tools
          python3 os/build.py --help
          python3 os/rust-build.py --help
          python3 os/x2000-c-build.py --help
          python3 os/install/prepare.py --help
          python3 os/install/build.py --help
          python3 os/install/generated_userdata.py --help
          python3 os/install/test_boot.py --help
          for script in os/hardware/player-bringup os/hardware/usb-storage os/install/bootstrap os/install/card-ssh os/install/diagnostic-ssh os/install/qemu-ready os/install/root-init os/install/state os/launcher.sh; do
            sh -n "$script"
          done
      - name: Test artifact and root filesystem input controls
        run: |
          python3 os/test_compatibility_inputs.py
          python3 os/test_timezone_data.py
          python3 os/test_usb_runtime.py
          python3 os/install/test_packaging_profile.py
          python3 os/install/test_overlay.py
          python3 os/test_sdk_release.py
          python3 os/install/test_tsrs_artifact.py
          python3 os/install/test_third_party_notices.py
          python3 os/install/test_portal_artifact.py
          python3 os/install/test_portal_capport_hook.py
          python3 os/test_kernel_faults.py
          python3 os/test_driver_functions.py
          python3 os/test_x2000_c.py
          python3 os/compose_ci.py --help
          python3 os/install/kernel_base.py --help
      - name: Test SSH keys, the launcher and card storage
        run: |
          python3 os/hardware/test_hostkey.py
          python3 os/test_launcher.py
          python3 os/test_usb_storage.py
          python3 os/test_root_init_overlap.py
          python3 os/test_install_root_init.py
          python3 os/test_usb_disconnect_startup.py
          python3 os/test_memory_guard.py
          python3 os/install/test_guest_script.py
          python3 os/install/test_guest_failure.py
      - name: Compile and inspect the native platform bridge
        run: |
          mkdir -p build/ci
          gcc -Wall -Wextra -Werror -D_TIME_BITS=64 -D_FILE_OFFSET_BITS=64 -fPIC -shared \
            -o build/ci/libq2platform.so os/platform/display.c os/platform/input.c
          nm -D --defined-only build/ci/libq2platform.so >build/ci/platform-symbols.txt
          grep -E ' T q2_touchscreen_open$' build/ci/platform-symbols.txt
          grep -E ' T q2_touchscreen_state$' build/ci/platform-symbols.txt
          gcc -Wall -Wextra -Werror -D_TIME_BITS=64 -D_FILE_OFFSET_BITS=64 \
            -o build/ci/test-headphones os/platform/test_headphones.c
          build/ci/test-headphones
          gcc -O2 -D_FORTIFY_SOURCE=1 -Wall -Wextra -Werror -o build/ci/q2-usb-auto-events os/platform/usb-auto-events.c
          rc=0
          build/ci/q2-usb-auto-events --invalid-test-argument || rc=$?
          test "$rc" -eq 2
